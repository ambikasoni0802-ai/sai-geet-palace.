<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sai Geet Palace – Book Your Flat</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf7f0;--card:#fff;--ink:#14213d;--mut:#6b7280;--gold:#b8913a;--line:#e6dfcf;--ok:#1f8a5b;--bad:#b3403a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1220;--card:#131c2f;--ink:#f3ecd9;--mut:#9aa4b8;--gold:#d4af5f;--line:#243049;--ok:#3ecf8e;--bad:#ef6b63}}
:root[data-theme="dark"]{--bg:#0b1220;--card:#131c2f;--ink:#f3ecd9;--mut:#9aa4b8;--gold:#d4af5f;--line:#243049;--ok:#3ecf8e;--bad:#ef6b63}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:6px;align-items:center;padding:10px 14px;background:var(--bg);border-bottom:1px solid var(--line);overflow-x:auto}
.logo{font-family:'Playfair Display',serif;font-weight:700;color:var(--gold);white-space:nowrap;margin-right:auto;font-size:18px;cursor:pointer}
nav button{background:none;border:0;color:var(--ink);padding:9px 14px;border-radius:999px;cursor:pointer;font:500 14px Inter,sans-serif;white-space:nowrap}
nav button.on{background:var(--ink);color:var(--bg)}
.hero{padding:70px 20px 50px;text-align:center;background:radial-gradient(circle at 50% 0,rgba(212,175,95,.22),transparent 60%)}
.tag{letter-spacing:.3em;font-size:12px;color:var(--gold);text-transform:uppercase}
h1{font-family:'Playfair Display',serif;font-size:clamp(36px,8vw,64px);margin:14px 0 10px}
h2{font-family:'Playfair Display',serif;font-size:30px;margin:0 0 6px}
.mut{color:var(--mut);line-height:1.6}
.btn{background:var(--gold);color:#14213d;border:0;padding:14px 26px;border-radius:999px;font-weight:600;font-size:15px;cursor:pointer;margin:4px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.stats{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:32px}
.stat{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:14px 22px}
.stat b{display:block;font-family:'Playfair Display',serif;font-size:24px;color:var(--gold)}
.stat span{font-size:12px;color:var(--mut)}
main{max-width:860px;margin:0 auto;padding:26px 16px 60px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 16px;border-radius:999px;cursor:pointer;font-size:14px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.floor{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:center;margin-bottom:12px}
.fl{font-family:'Playfair Display',serif;color:var(--gold);text-align:center;font-size:13px}.fl b{display:block;font-size:28px;color:var(--ink)}
.flats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.flat{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:13px;text-align:left;color:var(--ink);cursor:pointer;font:inherit}
.flat:hover:not(:disabled){border-color:var(--gold)}
.flat small{display:block;color:var(--mut);margin:2px 0 6px}.st{font-size:12px;font-weight:600;color:var(--ok)}
.flat:disabled{opacity:.55;cursor:not-allowed}.flat:disabled .st{color:var(--bad)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:16px}
.card h3{margin:0 0 14px;font-family:'Playfair Display',serif;font-size:20px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
label{font-size:13px;color:var(--mut);display:block;margin-bottom:4px}
input,select,textarea{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.ok{text-align:center;padding:40px 10px}.ok .big{font-size:54px}.ok code{background:var(--card);border:1px solid var(--line);padding:6px 12px;border-radius:8px;color:var(--gold)}
footer{text-align:center;color:var(--mut);font-size:13px;padding:30px}
.authwrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 50% 0,rgba(212,175,95,.18),transparent 60%)}
.authcard{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px;width:100%;max-width:380px}
.authcard h2{font-family:'Playfair Display',serif;margin:6px 0 4px}
.authcard label{margin-top:10px}
.autherr{background:rgba(179,64,58,.12);color:var(--bad);padding:10px 12px;border-radius:10px;font-size:13px;margin:10px 0}
.logout{margin-left:6px;color:var(--mut)}
</style>
</head>
<body>
<div id="auth" class="authwrap">
  <div class="authcard">
    <div class="tag">Sai Geet Palace</div>
    <h2 id="authTitle">Login</h2>
    <p class="mut" id="authSub">Login to book a flat or appointment.</p>
    <div id="authErr" class="autherr" style="display:none"></div>
    <label>Email</label><input id="aEm" type="email" autocomplete="email">
    <label>Password</label><input id="aPw" type="password" autocomplete="current-password">
    <button class="btn" style="width:100%;margin:14px 0 8px" id="authBtn" onclick="authGo()">Login</button>
    <div style="display:flex;align-items:center;gap:10px;margin:14px 0"><div style="flex:1;height:1px;background:var(--line)"></div><span class="mut" style="font-size:12px">OR</span><div style="flex:1;height:1px;background:var(--line)"></div></div>
    <button class="btn ghost" style="width:100%" onclick="authGoogle()">Continue with Google</button>
    <p class="mut" style="text-align:center;font-size:14px;margin-top:12px">
      <span id="authSwitch">New here? <a href="#" onclick="authMode('signup');return false">Create an account</a></span>
    </p>
  </div>
</div>
<nav id="nav" style="display:none"></nav>
<div id="app" style="display:none"></div>
<footer>© Sai Geet Palace. All rights reserved.</footer>
<script>
var FLOORS=7,KEY='sgp-booked',booked={},sel='',filt='all',$=function(i){return document.getElementById(i)};
try{booked=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(booked))}catch(e){}}
function flats(){var l=[];for(var f=1;f<=FLOORS;f++)for(var i=1;i<=4;i++)l.push({id:f+'0'+i,f:f,t:i<=2?'1 BHK':'2 BHK'});return l}
var TABS=[['home','Home'],['flats','Flats'],['book','Book Flat'],['appt','Appointment'],['history','History'],['contact','Contact']];
function go(p){location.hash=p}
function nav(p){$('nav').innerHTML='<span class="logo" onclick="go(\'home\')">Sai Geet Palace</span>'+TABS.map(function(t){return '<button class="'+(t[0]===p?'on':'')+'" onclick="go(\''+t[0]+'\')">'+t[1]+'</button>'}).join('')+'<button class="logout" onclick="authLogout()">Logout</button>'}
var V={
home:function(){var a=flats().filter(function(x){return!booked[x.id]}).length;
return '<section class="hero"><div class="tag">Premium Residences</div><h1>Sai Geet Palace</h1><p class="mut" style="max-width:520px;margin:0 auto 24px">Thoughtfully designed 1 BHK and 2 BHK homes across 7 floors. Pick your flat, book online or schedule a site visit.</p><button class="btn" onclick="go(\'flats\')">View Flats</button><button class="btn ghost" onclick="go(\'appt\')">Book Appointment</button><div class="stats"><div class="stat"><b>7</b><span>Floors</span></div><div class="stat"><b>28</b><span>Flats</span></div><div class="stat"><b>'+a+'</b><span>Available</span></div></div></section>'},
flats:function(){var h='<main><h2>Choose Your Flat</h2><div class="mut">Each floor: 2 × 1 BHK and 2 × 2 BHK. Tap an available flat to book.</div><div class="bar">'+['all','1 BHK','2 BHK'].map(function(c){return '<button class="chip'+(filt===c?' on':'')+'" onclick="filt=\''+c+'\';route()">'+(c==='all'?'All':c)+'</button>'}).join('')+'</div>';
for(var f=FLOORS;f>=1;f--){h+='<div class="floor"><div class="fl">FLOOR<b>'+f+'</b></div><div class="flats">';
flats().filter(function(x){return x.f===f&&(filt==='all'||x.t===filt)}).forEach(function(x){var b=booked[x.id];h+='<button class="flat"'+(b?' disabled':'')+' onclick="sel=\''+x.id+'\';go(\'book\')"><b>Flat '+x.id+'</b><small>'+x.t+'</small><span class="st">'+(b?'Booked':'Available')+'</span></button>'});
h+='</div></div>'}return h+'</main>'},
book:function(){var opts=flats().filter(function(x){return!booked[x.id]}).map(function(x){return '<option value="'+x.id+'"'+(x.id===sel?' selected':'')+'>Flat '+x.id+' – '+x.t+' (Floor '+x.f+')</option>'}).join('');
var F=function(id,l,t,x){return '<div><label>'+l+'</label><input id="'+id+'" type="'+(t||'text')+'" '+(x||'')+'></div>'};
return '<main><h2>Book Your Flat</h2><div class="mut" style="margin-bottom:18px">Fill in your details and documents to reserve a flat.</div>'+
'<div class="card"><h3>1. Select Flat</h3><select id="fl">'+opts+'</select></div>'+
'<div class="card"><h3>2. Personal Details</h3><div class="g">'+F('nm','Full name (as per Aadhaar)')+F('fa','Father / Husband name')+F('dob','Date of birth','date')+'<div><label>Gender</label><select id="gn"><option>Male</option><option>Female</option><option>Other</option></select></div>'+F('oc','Occupation')+'</div></div>'+
'<div class="card"><h3>3. Contact Details</h3><div class="g">'+F('ph','Mobile number','tel','inputmode="numeric" maxlength="10"')+F('wa','Alternate / WhatsApp number','tel','inputmode="numeric" maxlength="10"')+F('em','Email','email')+'</div></div>'+
'<div class="card"><h3>4. Address</h3><div class="g"><div style="grid-column:1/-1"><label>Full address</label><textarea id="ad" rows="2"></textarea></div>'+F('ct','City')+F('st','State')+F('pn','Pincode','text','inputmode="numeric" maxlength="6"')+'</div></div>'+
'<div class="card"><h3>5. ID Documents</h3><div class="g">'+F('aa','Aadhaar number (12 digits)','text','inputmode="numeric" maxlength="12"')+F('pc','PAN number','text','maxlength="10" style="text-transform:uppercase"')+F('au','Upload Aadhaar (front &amp; back)','file','accept="image/*,.pdf"')+F('pu','Upload PAN card','file','accept="image/*,.pdf"')+F('ph2','Passport size photo','file','accept="image/*"')+'</div></div>'+
'<div class="card"><h3>6. Payment</h3><div class="g"><div><label>Payment mode</label><select id="pm"><option>UPI</option><option>Bank transfer</option><option>Cheque</option><option>Cash at office</option></select></div>'+F('am','Token amount (₹)','number')+'</div></div>'+
'<label style="display:flex;gap:10px;align-items:flex-start;margin:14px 0;color:var(--ink)"><input type="checkbox" id="cn" style="width:auto;margin-top:3px">I confirm the details above are correct and agree to the booking terms.</label><button class="btn" onclick="submitBook()">Confirm Booking</button></main>'},
appt:function(){var d=new Date().toISOString().slice(0,10);
return '<main><h2>Book an Appointment</h2><div class="mut" style="margin-bottom:18px">Visit the site or meet our team at a time that suits you.</div><div class="card"><div class="g"><div><label>Full name</label><input id="an"></div><div><label>Mobile number</label><input id="ap" type="tel" inputmode="numeric" maxlength="10"></div><div><label>Purpose</label><select id="pp"><option>Site visit</option><option>Meet the team</option><option>Loan / documentation help</option><option>Phone call</option></select></div><div><label>Interested in</label><select id="ai"><option>1 BHK</option><option>2 BHK</option><option>Not sure</option></select></div><div><label>Date</label><input id="ad2" type="date" min="'+d+'"></div><div><label>Time slot</label><select id="at">'+['10:00 AM','11:00 AM','12:00 PM','02:00 PM','03:00 PM','04:00 PM','05:00 PM'].map(function(t){return '<option>'+t+'</option>'}).join('')+'</select></div><div style="grid-column:1/-1"><label>Message (optional)</label><textarea id="am2" rows="2"></textarea></div></div></div><button class="btn" onclick="submitAppt()">Confirm Appointment</button></main>'},
history:function(){var rows=window._hist;
var body=!rows?'':(rows.length?'<div class="card">'+rows.map(function(x){
return '<div style="padding:10px 0;border-bottom:1px solid var(--line)"><b>'+(x.kind==='Booking'?'\ud83c\udfe0 Booking \u2013 Flat '+x.ref:'\ud83d\udcc5 Appointment \u2013 '+x.ref)+'</b><br><span class="mut" style="font-size:13px">Status: '+x.status+' \u00b7 Taken on '+new Date(x.created_at).toLocaleString()+'</span></div>'
}).join('')+'</div>':'<p class="mut">No booking or appointment found for this number.</p>');
return '<main><h2>My History</h2><div class="mut" style="margin-bottom:18px">Enter your mobile number to see all bookings and appointments you have made, with dates.</div>'+
'<div class="card"><div class="g"><div><label>Mobile number</label><input id="hp" type="tel" inputmode="numeric" maxlength="10" value="'+(window._hp||'')+'"></div></div><button class="btn" style="margin-top:14px" onclick="loadHistory()">View History</button></div>'+
body+'</main>'},
contact:function(){return '<main><h2>Contact Us</h2><div class="card"><h3>Sai Geet Palace</h3><p class="mut">Phone, WhatsApp, email and address will be added here.</p><button class="btn" onclick="go(\'appt\')">Book Appointment</button></div></main>'},
done:function(){var m=window._m||{};return '<main class="ok"><div class="big">✅</div><h2>'+m.t+'</h2><p class="mut">'+m.b+'</p><p>Reference ID: <code>'+m.id+'</code></p><button class="btn" onclick="go(\'home\')">Back to Home</button></main>'}
};
function v(i){return($(i)||{}).value?$(i).value.trim():''}
function done(t,b,p){window._m={t:t,b:b,id:p+Math.random().toString(36).slice(2,8).toUpperCase()};go('done')}
function submitBook(){
var e=[];if(!v('fl'))e.push('Select a flat');if(!v('nm'))e.push('Full name');if(!/^\d{10}$/.test(v('ph')))e.push('10-digit mobile number');
if(!v('ad')||!/^\d{6}$/.test(v('pn')))e.push('Address with 6-digit pincode');if(!/^\d{12}$/.test(v('aa')))e.push('12-digit Aadhaar number');
if(!/^[A-Za-z]{5}\d{4}[A-Za-z]$/.test(v('pc')))e.push('Valid PAN (e.g. ABCDE1234F)');if(!$('cn').checked)e.push('Accept the confirmation');
if(e.length){alert('Please fix:\n• '+e.join('\n• '));return}
sendBooking()}
function submitAppt(){
if(!v('an')||!/^\d{10}$/.test(v('ap'))||!v('ad2')){alert('Please enter name, 10-digit mobile and date.');return}
sendAppt()}
function route(){var p=(location.hash||'#home').slice(1);if(!V[p])p='home';nav(p);$('app').innerHTML=V[p]();window.scrollTo(0,0)}
window.onhashchange=route;
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
var SUPABASE_URL='https://rcgqjxprqtlipsemeugl.supabase.co',SUPABASE_KEY='sb_publishable_infsKZXhf2rdkOvX77E3wQ_oSho9HqR';
var sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
booked={};save=function(){};
async function loadBooked(){try{var r=await sb.from('booked_flats').select('flat_no');booked={};(r.data||[]).forEach(function(x){booked[x.flat_no]=1})}catch(e){}route()}
async function up(id,ref,k){var f=$(id)&&$(id).files[0];if(!f)return null;var p=ref+'/'+k+'-'+f.name.replace(/[^\w.]/g,'_');var r=await sb.storage.from('documents').upload(p,f);return r.error?null:p}
async function sendBooking(){
var btn=document.querySelector('main .btn');btn.disabled=true;btn.textContent='Submitting...';
var ref=crypto.randomUUID();
var row={flat_no:v('fl'),name:v('nm'),father_name:v('fa'),dob:v('dob')||null,gender:v('gn'),occupation:v('oc'),phone:v('ph'),alt_phone:v('wa'),email:v('em'),address:v('ad'),city:v('ct'),state:v('st'),pincode:v('pn'),aadhaar:v('aa'),pan:v('pc').toUpperCase(),payment_mode:v('pm'),amount:v('am')||null};
row.aadhaar_file=await up('au',ref,'aadhaar');row.pan_file=await up('pu',ref,'pan');row.photo_file=await up('ph2',ref,'photo');
var r=await sb.from('bookings').insert(row);
if(r.error){btn.disabled=false;btn.textContent='Confirm Booking';var dup=r.error.code==='23505';alert(dup?'Sorry, this flat was just booked. Please choose another.':'Could not submit. Please try again.');if(dup)loadBooked();return}
booked[row.flat_no]=1;
done('Booking Received','Flat '+row.flat_no+' is reserved for '+row.name+'. Our team will call you on '+row.phone+' to complete the process.','BK-')}
async function sendAppt(){
var r=await sb.from('appointments').insert({name:v('an'),phone:v('ap'),purpose:v('pp'),interested_in:v('ai'),appt_date:v('ad2'),time_slot:v('at'),message:v('am2')});
if(r.error){alert('Could not submit. Please try again.');return}
done('Appointment Confirmed',v('pp')+' on '+v('ad2')+' at '+v('at')+'. We will call '+v('ap')+' to confirm.','AP-')}
var authM='login';
function authMode(m){authM=m;var t=$('authTitle'),s=$('authSub'),b=$('authBtn'),sw=$('authSwitch');
if(m==='signup'){t.textContent='Create Account';s.textContent='Sign up with your email to continue.';b.textContent='Create Account';sw.innerHTML='Already have an account? <a href="#" onclick="authMode(\'login\');return false">Login</a>'}
else{t.textContent='Login';s.textContent='Login to book a flat or appointment.';b.textContent='Login';sw.innerHTML='New here? <a href="#" onclick="authMode(\'signup\');return false">Create an account</a>'}
$('authErr').style.display='none'}
function authErr(m){var e=$('authErr');e.textContent=m;e.style.display='block'}
async function authGo(){
var em=$('aEm').value.trim(),pw=$('aPw').value;
if(!em||!pw){authErr('Please enter email and password.');return}
if(pw.length<6){authErr('Password must be at least 6 characters.');return}
$('authBtn').disabled=true;$('authBtn').textContent='Please wait...';
var r=authM==='signup'?await sb.auth.signUp({email:em,password:pw}):await sb.auth.signInWithPassword({email:em,password:pw});
$('authBtn').disabled=false;authMode(authM);
if(r.error){authErr(r.error.message);return}
if(authM==='signup'&&!r.data.session){authErr('Account created. If email confirmation is required, please check your inbox, then login.');return}
showApp()}
async function authLogout(){await sb.auth.signOut();$('nav').style.display='none';$('app').style.display='none';$('auth').style.display='flex';$('aEm').value='';$('aPw').value=''}
async function authGoogle(){await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.href.split('#')[0]}})}
function showApp(){$('auth').style.display='none';$('nav').style.display='flex';$('app').style.display='block';loadBooked()}
(function(){var h=location.hash||'',q=location.search||'',m=h.match(/error_description=([^&]*)/)||q.match(/error_description=([^&]*)/)||h.match(/error=([^&]*)/)||q.match(/error=([^&]*)/);
if(m)authErr(decodeURIComponent(m[1].replace(/\+/g,' ')))})();
(async function initAuth(){var s=await sb.auth.getSession();if(s.data.session)showApp()})();
async function loadHistory(){
var p=v('hp');if(!/^\d{10}$/.test(p)){alert('Please enter a valid 10-digit mobile number.');return}
window._hp=p;
var r=await sb.rpc('get_history',{p_phone:p});
window._hist=r.error?[]:(r.data||[]);
route()}
</script>
</body>
</html>
